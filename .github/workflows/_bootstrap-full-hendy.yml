name: One-time HENDY source tree import
on:
  push:
    branches:
      - rebuild/hendy-full-stack-ubuntu2604
    paths:
      - .github/workflows/_bootstrap-full-hendy.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch with history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Checkout pinned HENDY application source
        env:
          SOURCE_SHA: 78198bdf2fac47c5b890386243f6129f140212f1
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/hendyngo-servers/hendydichvumang.git "$RUNNER_TEMP/hendy-source"
          git -C "$RUNNER_TEMP/hendy-source" checkout --quiet "$SOURCE_SHA"
          test -f "$RUNNER_TEMP/hendy-source/telegram-bot/app/BotService.php"
          test -f "$RUNNER_TEMP/hendy-source/telegram-bot/app/ProviderRegistryService.php"
          test -f "$RUNNER_TEMP/hendy-source/telegram-bot/app/ProductReadinessService.php"
          test -f "$RUNNER_TEMP/hendy-source/telegram-bot/app/MultiAgentService.php"
          test -f "$RUNNER_TEMP/hendy-source/deploy/ubuntu/compose.yaml"
          if find "$RUNNER_TEMP/hendy-source" -type f \( -name '.env' -o -name 'hendy.env' \) -print -quit | grep -q .; then
            echo "Refusing import: a real environment file is tracked in the source snapshot." >&2
            exit 1
          fi
      - name: Install PHP for repository secret scan
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Scan pinned source for credential patterns
        run: php "$RUNNER_TEMP/hendy-source/telegram-bot/scripts/secret-scan.php"
      - name: Replace target working tree while preserving target Git history
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' "$RUNNER_TEMP/hendy-source/" "$GITHUB_WORKSPACE/"
          test -f telegram-bot/database/schema.sql
          test -f telegram-bot/database/migrations/20261120_multi_agent_control_center.sql
          test -f deploy/ubuntu/hendy.env.example
          test ! -e deploy/ubuntu/hendy.env
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild source tree as full HENDY Ubuntu 26.04 platform"
          git push origin "HEAD:${GITHUB_REF_NAME}"
