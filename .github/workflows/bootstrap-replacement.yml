name: Bootstrap Multi-Agent replacement

on:
  push:
    branches:
      - rebuild/multi-agent-platform

permissions:
  contents: write

concurrency:
  group: hendy-multi-agent-bootstrap
  cancel-in-progress: false

jobs:
  replace-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hendy_test
          POSTGRES_PASSWORD: hendy_test_password
          POSTGRES_DB: hendy_multi_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hendy_test -d hendy_multi_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://hendy_test:hendy_test_password@localhost:5432/hendy_multi_agent_test
      TEST_DATABASE_URL: postgresql://hendy_test:hendy_test_password@localhost:5432/hendy_multi_agent_test
      PGSSLMODE: disable
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: test-only-password-not-for-production
      ADMIN_PASSWORD_SALT: test-only-random-salt-long-enough
      SESSION_SECRET: test-only-session-secret-with-more-than-32-chars
      MULTI_AGENT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace application source and verify on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hendy-multi-agent-bootstrap
          cp -a .github/workflows /tmp/hendy-multi-agent-bootstrap/existing-workflows
          cp bootstrap/part-* /tmp/hendy-multi-agent-bootstrap/
          cat /tmp/hendy-multi-agent-bootstrap/part-* > /tmp/hendy-multi-agent-bootstrap/source.tar.gz.b64
          base64 -d /tmp/hendy-multi-agent-bootstrap/source.tar.gz.b64 > /tmp/hendy-multi-agent-bootstrap/source.tar.gz
          echo "b2b00ddde00b8bce2956e5f00f9cd389bd4476541934c27d664dceb04aecec7a  /tmp/hendy-multi-agent-bootstrap/source.tar.gz" | sha256sum -c -
          tar -tzf /tmp/hendy-multi-agent-bootstrap/source.tar.gz >/dev/null
          git ls-files -z | xargs -0 -r git rm -f --
          tar -xzf /tmp/hendy-multi-agent-bootstrap/source.tar.gz -C .
          rm -rf .github/workflows
          mkdir -p .github
          cp -a /tmp/hendy-multi-agent-bootstrap/existing-workflows .github/workflows
          rm -rf bootstrap
          npm install --no-audit --no-fund
          npm run migrate
          npm test
          find src public test -name '*.js' -print0 | xargs -0 -n1 node --check
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace application source with standalone HENDY Multi-Agent platform"
          git push origin "HEAD:${GITHUB_REF_NAME}"
