name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hendy-multi-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hendy_test
          POSTGRES_PASSWORD: hendy_test_password
          POSTGRES_DB: hendy_multi_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hendy_test -d hendy_multi_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://hendy_test:hendy_test_password@localhost:5432/hendy_multi_agent_test
      TEST_DATABASE_URL: postgresql://hendy_test:hendy_test_password@localhost:5432/hendy_multi_agent_test
      PGSSLMODE: disable
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: test-only-password-not-for-production
      ADMIN_PASSWORD_SALT: test-only-random-salt-long-enough
      SESSION_SECRET: test-only-session-secret-with-more-than-32-chars
      MULTI_AGENT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply migrations to disposable CI database
        run: npm run migrate
      - name: Run unit and PostgreSQL integration tests
        run: npm test
      - name: Check JavaScript syntax
        run: find src public test -name '*.js' -print0 | xargs -0 -n1 node --check
