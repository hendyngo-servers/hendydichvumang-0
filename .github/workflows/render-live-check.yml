name: Render Live Verification

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: render-live-verification
  cancel-in-progress: true

jobs:
  verify-render:
    if: >-
      ${{ vars.RENDER_LIVE_CHECK_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_STATIC_SERVICE_ID: ${{ vars.RENDER_STATIC_SERVICE_ID }}
      RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
      RENDER_AIOGRAM_CHECK_ENABLED: ${{ vars.RENDER_AIOGRAM_CHECK_ENABLED }}
      RENDER_AIOGRAM_SERVICE_ID: ${{ vars.RENDER_AIOGRAM_SERVICE_ID }}
      RENDER_DEPLOY_WAIT_ATTEMPTS: "18"
      RENDER_DEPLOY_WAIT_INTERVAL_MS: "15000"
      REPOSITORY_URL: https://github.com/hendyngo-servers/hendydichvumang-0
      EXPECTED_BRANCH: main
      EXPECTED_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Detect Render domains and verify Live deployment
        run: npm run verify:render-live
