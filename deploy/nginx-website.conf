server {
    listen 10000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 210m;
    server_tokens off;

    resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
    set $hendy_backend hendydichvumang-telegram-bot.onrender.com;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz.html {
        default_type text/plain;
        access_log off;
        try_files /healthz.html =503;
    }

    location = /admin { return 302 https://hendydichvumang-telegram-bot.onrender.com/admin$is_args$args; }
    location = /admin/ { return 302 https://hendydichvumang-telegram-bot.onrender.com/admin$is_args$args; }
    location ~ ^/(customer|customer-center|mini-app|app)/?$ { return 302 /miniapp/$is_args$args; }
    location = /miniapp { return 301 /miniapp/$is_args$args; }

    location = /api {
        proxy_pass https://$hendy_backend$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name hendydichvumang-telegram-bot.onrender.com;
        proxy_set_header Host $hendy_backend;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location ^~ /api/ {
        proxy_pass https://$hendy_backend$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name hendydichvumang-telegram-bot.onrender.com;
        proxy_set_header Host $hendy_backend;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location ^~ /auth/ {
        proxy_pass https://$hendy_backend$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name hendydichvumang-telegram-bot.onrender.com;
        proxy_set_header Host $hendy_backend;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location / { try_files $uri $uri/ =404; }
}
