envVarGroups:
  - name: hendy-multi-agent-shared
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_SALT
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-6.2-astra
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: PGSSLMODE
        value: require
      - key: PG_POOL_MAX
        value: "5"
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: MULTI_AGENT_ENABLED
        value: "false"
      - key: MULTI_AGENT_WORKER_POLL_SECONDS
        value: "5"
      - key: MULTI_AGENT_MAX_ATTEMPTS
        value: "3"
      - key: MULTI_AGENT_STALE_MINUTES
        value: "15"
      - key: MULTI_AGENT_CONCURRENCY
        value: "1"
      - key: NODE_ENV
        value: production

services:
  - type: web
    name: hendy-multi-agent-api
    runtime: docker
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - fromGroup: hendy-multi-agent-shared
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PORT
        value: "10000"

  - type: worker
    name: hendy-multi-agent-worker
    runtime: docker
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run worker
    envVars:
      - fromGroup: hendy-multi-agent-shared
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PORT
        value: "10000"
